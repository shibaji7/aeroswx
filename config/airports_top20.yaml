# TODO: verify against latest FAA ranking
#   The list below is a PLACEHOLDER based on the FAA's top airports by total
#   operations (takeoffs + landings). The exact ranking changes year to year
#   (and FAA/ATADS vs. BTS passenger rankings differ). Order is approximate
#   and is NOT used by any code -- membership is.
#
# ANC is included deliberately (it is outside the strict top-20 by operations
# and passenger count) to widen the geomagnetic-latitude spread of the sample.
# It takes the 20th slot, so the study set is 19 ranked airports + ANC.
